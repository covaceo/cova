# Authorized one-off reference Redis 7.2 Lua test; no deployment or provider calls.
name: Ask Cova isolated Redis Lua gate
on:
  push:
    branches:
      - 'qa/ask-cova-redis-lua-once-20261031T193823Z-84f23d22'
permissions:
  contents: read
jobs:
  redis-lua:
    if: github.repository == 'covaceo/cova' && github.event_name == 'push' && github.ref == 'refs/heads/qa/ask-cova-redis-lua-once-20261031T193823Z-84f23d22' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: redis:7.2.17-bookworm@sha256:0312984fbfeb2ff1d4382ecef45b50e7d65478a6a58cf12ce28d6de7a4142e45
      options: --cpus 2 --memory 2g
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Validate frozen payload and install only locked TypeScript
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # A disposable fixture avoids full-site install/build/lifecycle scripts.
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(process.env.RUNNER_TEMP, 'ask-cova-lua-only');
          fs.mkdirSync(root, {recursive: false});
          const lockBytes = fs.readFileSync('package-lock.json');
          if (require('node:crypto').createHash('sha256').update(lockBytes).digest('hex') !== '3f182ba299dcdc34191ec394e8bd9b9d0c9aaab65eefe8b6200ef35fe5d7ad11') throw Error('Frozen lockfile mismatch');
          const pkg = JSON.parse(lockBytes).packages['node_modules/typescript'];
          if (pkg.version !== '5.9.3' || pkg.resolved !== 'https://registry.npmjs.org/typescript/-/typescript-5.9.3.tgz' || pkg.integrity !== 'sha512-jl1vZzPDinLr9eUt3J/t7V6FgNEw9QjvBPdysz9KfQDD41fQrC2Y4vKQdiaUpFT4bXlb1RHhLpp8wtm6M5TgSw==') throw Error('Reviewed dependency changed');
          const manifest = {name:'ask-cova-lua-only', version:'0.0.0', private:true, type:'module', dependencies:{typescript:pkg.version}};
          const dep = {...pkg}; delete dep.dev;
          fs.writeFileSync(path.join(root,'package.json'), JSON.stringify(manifest));
          fs.writeFileSync(path.join(root,'package-lock.json'), JSON.stringify({name:manifest.name,version:manifest.version,lockfileVersion:3,requires:true,packages:{'':{name:manifest.name,version:manifest.version,dependencies:manifest.dependencies},'node_modules/typescript':dep}}));
          const files = ['scripts/ask-cova-budget-regression.mjs','scripts/helpers/load-ts.cjs','server/askCovaBudget.ts','src/lib/workspaceValidation.ts','src/lib/manualAccountKeys.ts','src/lib/tradovateHistory.ts','src/lib/risk.ts'];
          const crypto = require('node:crypto');
          const expected = {
            'scripts/ask-cova-budget-regression.mjs':'d92c13c10af6600b8feb82b4b6c3197125b3bb7d9c1108056b49a242fb530045',
            'scripts/helpers/load-ts.cjs':'27aaaece0874c0a2f00cf4aa3d5c977b1babfc12f9e1006a30ce7102258ed512',
            'server/askCovaBudget.ts':'4fb7b0a77eac5f16a9996ede12810e6f6656c633869d7da395ad8f8bd4dd1845',
            'src/lib/workspaceValidation.ts':'7fbb09367555d865d0a3a63c64c8a620b9b4a4ce0165f1f686fe9cd04de6e94c',
            'src/lib/manualAccountKeys.ts':'ea4a2a139e12a1289c9850a0c56765d9504f1700204e808aa6ace10efc101719',
            'src/lib/tradovateHistory.ts':'c22f5007a715024bf0b8a2e8dcc6d9dfeb0754129143b27d1cba2df3cb84b421',
            'src/lib/risk.ts':'832edf23ec0c52cec13790c602b8d32a3bb25ed45a614d0d23ae28eba290dae8'
          };
          for (const file of files) {
            const dest = path.join(root,file); fs.mkdirSync(path.dirname(dest),{recursive:true}); fs.copyFileSync(file,dest);
            const sha = crypto.createHash('sha256').update(fs.readFileSync(dest)).digest('hex');
            if (sha !== expected[file]) throw Error('Frozen source mismatch: '+file);
            console.log(sha+'  '+file);
          }
          NODE
          mkdir -p "$RUNNER_TEMP/redis-clean-home"
          cd "$RUNNER_TEMP/ask-cova-lua-only"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/redis-clean-home" \
            npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org \
            --userconfig="$RUNNER_TEMP/redis-clean-home/user.npmrc" \
            --globalconfig="$RUNNER_TEMP/redis-clean-home/global.npmrc"
      - name: Run actual child Redis and reject any skipped gate
        run: |
          set -euo pipefail
          redis_bin="$(command -v redis-server)"
          "$redis_bin" --version
          node --version
          cd "$RUNNER_TEMP/ask-cova-lua-only"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/redis-clean-home" TMPDIR="$RUNNER_TEMP" \
            COVA_TEST_REDIS_SERVER="$redis_bin" \
            node --test --test-reporter=tap scripts/ask-cova-budget-regression.mjs \
            | tee "$RUNNER_TEMP/ask-cova-redis-lua.tap"
          env -i PATH="$PATH" node --input-type=commonjs - "$RUNNER_TEMP/ask-cova-redis-lua.tap" <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          // 15 top-level tests + 3 real-Redis children = 18 total tests.
          const actual = text.split(/\r?\n/).filter(line => /^ok \d+ - actual Redis Lua: concurrency, near-cap, durable replay, campaign pin and unknown outcomes$/.test(line));
          if (actual.length !== 1 || !/^1\.\.15\s*$/m.test(text) || !/^# tests 18\s*$/m.test(text) || !/^# pass 18\s*$/m.test(text) || !/^# cancelled 0\s*$/m.test(text) || !/^# todo 0\s*$/m.test(text) || /^\s*(?:not )?ok [^\r\n]*#\s*(SKIP|TODO)\b/im.test(text) || !/^# fail 0\s*$/m.test(text) || !/^# skipped 0\s*$/m.test(text)) {
            throw Error('Actual Redis/Lua gate did not pass unskipped');
          }
          console.log('UNSKIPPED_REAL_REDIS_LUA_GATE_PASSED');
          NODE
